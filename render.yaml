services:
  - type: web
    name: android-remote-manager-api
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: android-remote-manager-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: android-remote-manager-api
          property: host

  - type: web
    name: android-remote-manager-dashboard
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist

databases:
  - name: android-remote-manager-db
    plan: free
    region: frankfurt
